name: Update cigar deals

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/update-deals.yml"

permissions:
  contents: write

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Check the stores
        run: python scraper/scrape.py

      - name: Save new deals
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add deals.json scraper/product-cache.json scraper/debug || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update deals $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
